[project]
name = "israel-transport-homeassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "hishel>=0.1.1",
  "homeassistant>=2025.2.3",
  "loguru>=0.7.3",
  "pydantic>=2.10.6"
]

[project.optional-dependencies]
test = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.1"
]


[tool.ruff]
select = ["ALL"]
exclude = ["uk_transport"]
ignore = [
  "ANN",
  "COM812",
  "D",
  "DTZ",
  "E501",
  "EM101",
  "EM102",
  "FA",
  "FBT001",
  "FBT002",
  "FBT003",
  "FIX002",
  "G003",
  "G004",
  "INP001",
  "ISC001",
  "PD901",
  "PLR0913",
  "S113",
  "S501",
  "S603",
  "S607",
  "TD002",
  "TD003",
  "TD004",
  "TRY003"
]

[tool.ruff.per-file-ignores]
"custom_components/Israeli_transport/sensor.py" = ["ARG001"]
"tests*" = ["S101", "PLR2004", "ARG001"]
